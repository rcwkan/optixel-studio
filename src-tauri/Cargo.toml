[package]
name = "optixel-studio"
version = "0.3.0"
description = "Optixel Studio: non-destructive RAW processor and DAM with a built-in MCP server"
authors = ["Optixel Studio contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "optixel_studio_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = { version = "1.1", features = ["parallel"] }
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
image = "0.25.10"
kamadak-exif = "0.6.1"
rayon = "1.12.0"
tiny_http = "0.12.0"
base64 = "0.23.1"
shlex = "2.0.1"
dirs = "7.0.0"
rawler = "0.8.0"
getrandom = "0.4.3"
ureq = { version = "3.5.0", features = ["json"] }
moxcms = "0.8.1"
lcms2 = { version = "6.2", features = ["static"] }
jxl-oxide = { version = "0.12", features = ["lcms2"] }
ring = "0.17"
wgpu = { version = "30.0.1", features = ["spirv"] }
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
ort = { version = "=2.0.0-rc.15", features = ["half"] }
half = "2.7.1"
regex = "1.13.1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
# lossless JPEG rotate/flip/crop: libjpeg-turbo built from its bundled source (cmake), linked statically,
# never a system copy. Its x86 SIMD needs NASM on the build machine (ARM uses NEON, nothing to install).
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml", "half"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["coreml", "half"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Pixel loops and image codecs are unusably slow unoptimised.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
